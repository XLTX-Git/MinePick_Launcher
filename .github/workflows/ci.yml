name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install lint tools
        run: python -m pip install "ruff>=0.4"

      - name: ruff
        run: ruff check .

      - name: GPL headers
        run: python scripts/check_headers.py

      - name: README translations stay in sync
        run: python tools/check_readme_sync.py

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # PySide6 wheels bundle Qt but not the system libraries the offscreen plugin
      # links against. Without these, importing Qt fails before any test runs.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig \
            libfontconfig1 \
            libgl1 \
            libegl1 \
            libopengl0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libglib2.0-0t64 \
            libxcb-cursor0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # Fail with "libGL.so.1: cannot open shared object file" here rather than
      # inside a GUI test whose traceback would hide the real cause.
      - name: Qt offscreen smoke test
        run: |
          python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); platform = app.platformName(); print(f'Qt platform: {platform}'); assert platform == 'offscreen', platform"

      - name: Pytest subset
        run: python -m pytest -q "@.github/ci-tests.txt"
